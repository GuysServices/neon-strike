name: Build iOS IPA
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          
      - name: Install Dependencies
        run: npm install
        
      - name: Add & Sync iOS
        run: |
          npm install @capacitor/ios
          npx cap add ios || echo "iOS already added"
          
      - name: Generate App Icons
        run: |
          npm install @capacitor/assets
          npx capacitor-assets generate --icon icon.png --ios
          
      - name: Sync iOS
        run: npx cap sync ios
          
      - name: Build iOS App (Unsigned)
        run: |
          cd ios/App
          xcodebuild -project App.xcodeproj -scheme App -configuration Release -sdk iphoneos -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""
          
      - name: Package IPA
        run: |
          mkdir Payload
          mv ios/App/build/Build/Products/Release-iphoneos/App.app Payload/
          zip -r NeonStrike.ipa Payload
          
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: NeonStrike-App
          path: NeonStrike.ipa
